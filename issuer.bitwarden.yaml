apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: vault-issuer
  namespace: bitwarden
  annotations:
    avp.kubernetes.io/path: "secrets/data/infra/vault/prod"
spec:
  vault:
    server: <vault_url> 
    path: <pki_sign_int_path>
    auth:
      kubernetes:
        mountPath: /v1/auth/kubernetes
        role: cert-manager-pki 
        serviceAccountRef:
          name: cert-manager
