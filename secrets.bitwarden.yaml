apiVersion: v1
kind: Secret
metadata:
  name: admin-tokens
  namespace: bitwarden
type: Opaque
stringData:
  ADMIN_TOKEN: <path:secrets/data/apps/bitwarden/prod#ADMIN_TOKEN>
  SMTP_PASSWORD: <path:secrets/data/apps/bitwarden/prod#SMTP_PASSWORD>
  SMTP_USERNAME: <path:secrets/data/apps/bitwarden/prod#SMTP_USERNAME>
  DATABASE_MAX_CONNS: "10"
  ROCKET_LIMITS: "{json=100000000}"
  ROCKET_WORKERS: "10"
