apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bitwarden-storage-pvc
  namespace: bitwarden
  labels:
    type: nfs
    app: bitwarden
spec:
  volumeName: bitwarden-storage-pv
  storageClassName: ""
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi


